<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistema Visual Clínico · Para Psicólogos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/src/index.css">
</head>
<body>

  <div id="login-screen" class="login-overlay">
    <div class="login-card">
      <div class="login-icon">Ψ</div>
      <h2>Acceso Privado</h2>
      <p>Sistema Visual Clínico</p>
      <form id="login-form">
        <div class="form-group">
          <input type="email" id="login-email" placeholder="Correo electrónico" required>
        </div>
        <div class="form-group">
          <input type="password" id="login-password" placeholder="Contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Iniciar Sesión</button>
        <p id="login-error" class="error-text" style="display:none; color:#ef4444; font-size:12px; margin-top:10px; text-align:center;">Credenciales incorrectas.</p>
      </form>
    </div>
  </div>

  <div id="app-content" style="display: none;">
    </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
